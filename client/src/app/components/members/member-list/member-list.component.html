<section class="container">
    <h1>Choose Your Doctor</h1>
    <div class="doctors-container">
        @for (doctor of doctors; track $index) {
        <mat-card class="card">
            <div class="card-img">
                <img src="images/male-doctor.jpg" alt="doctor">

                <ul class="doctor-icons">
                    <li>
                    <li>
                        <button mat-mini-fab class="first">
                            <mat-icon>badge</mat-icon>
                        </button>
                    </li>

                    <li>
                        <button mat-mini-fab class="second">
                            <mat-icon>thumb_up</mat-icon>
                        </button>
                    </li>

                    <li>
                        <button mat-mini-fab class="third">
                            <mat-icon>share</mat-icon>
                        </button>
                    </li>
                </ul>
            </div>

            <mat-card-header>
                <div class="title">
                    <mat-icon>emoji_people</mat-icon>
                </div>

                <mat-card-subtitle>{{ doctor.Specialty }}</mat-card-subtitle>
            </mat-card-header>
        </mat-card>
        }
    </div>
</section>
