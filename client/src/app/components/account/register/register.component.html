<section>
    <form>
        <h1>Register Your Account</h1>
        <mat-radio-group aria-label="Select an option" [formControl]="GenderCtrl">
            <span>Gender:</span>
            <mat-radio-button value="female">Female</mat-radio-button>
            <mat-radio-button value="male">Male</mat-radio-button>
        </mat-radio-group>

        <mat-form-field appearance="outline">
            <mat-label>First Name</mat-label>
            <input type="text" [formControl]="FirstNameCtrl" matInput placeholder="Enter Your First Name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input type="text" [formControl]="LastNameCtrl" matInput placeholder="Enter Your Last Name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>National Code</mat-label>
            <input type="text" [formControl]="NationalCodeCtrl" matInput placeholder="Enter Your National Code" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input type="text" [formControl]="PhoneNumberCtrl" matInput placeholder="Enter Your Phone Number" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Birth Date</mat-label>
            <input type="text" [formControl]="BirthDateCtrl" matInput placeholder="Enter Your Birth Date" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input type="password" [formControl]="PasswordCtrl" matInput placeholder="Enter Your Password" />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Confirm Password</mat-label>
            <input type="text" [formControl]="ConfirmPasswordCtrl" matInput placeholder="Enter Your Confirm Password" />
        </mat-form-field>

        <button (click)="register()" mat-raised-button>Register</button>

        <p>
            First Name: {{ userRes?.firstName }}
            <br>
            Last Name: {{ userRes?.lastName }}
        </p>

    </form>
</section>
