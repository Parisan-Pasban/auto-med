<mat-toolbar>
    <section class="left">
        <a routerLink="/" class="brand">
            <mat-icon>local_hospital</mat-icon>
            Auto Med
        </a>
    </section>

    <section class="right">
        @if (accountService.loggedInUserUserSig()) {
        <button class="logout" (click)="logout()" mat-raised-button>Logout</button>
        } @else {
        <button routerLink="account/register" mat-raised-button>Register</button>
        <button routerLink="account/login" mat-raised-button>Login</button>
        }
    </section>
</mat-toolbar>
